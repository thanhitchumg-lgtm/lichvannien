<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Lịch Vạn Niên">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">
    
    <title>Lịch Vạn Niên</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --primary: #FF3B30; /* Đỏ đặc trưng lịch vạn niên */
            --text-main: #000000;
            --text-sub: #8E8E93;
            --accent: #007AFF;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }
        body {
            margin: 0;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            user-select: none;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 16px 0;
            text-align: center;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 16px;
            text-align: center;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        select {
            padding: 8px 12px;
            border: 1px solid #E5E5EA;
            border-radius: 8px;
            font-size: 15px;
            background: #FAFAFC;
            outline: none;
            font-weight: 600;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }
        .week-day {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            padding: 6px 0;
        }
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #FAFAFC;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.1s;
        }
        .day-cell.solar {
            font-size: 16px;
            font-weight: 600;
        }
        .day-cell.lunar {
            font-size: 10px;
            color: var(--text-sub);
        }
        .day-cell.today {
            border-color: var(--primary);
        }
        .day-cell.selected {
            background: var(--primary);
            color: white;
        }
        .day-cell.selected .lunar {
            color: #FFE5E5;
        }
        .detail-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 16px;
        }
        .solar-big {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }
        .lunar-big {
            font-size: 15px;
            font-weight: 600;
            color: #555;
            margin-bottom: 12px;
        }
        .info-row {
            font-size: 14px;
            color: var(--text-sub);
            margin: 6px 0;
        }
        .info-row span {
            color: var(--text-main);
            font-weight: 600;
        }
        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border: 1px solid #E5E5EA;
            border-radius: 10px;
            font-size: 14px;
            resize: none;
            margin-top: 10px;
            outline: none;
            background: #FAFAFC;
        }
        .save-note-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            width: 100%;
        }
        /* Chân trang bản quyền */
        .footer-copyright {
            text-align: center;
            font-style: italic;
            color: var(--text-sub);
            font-size: 13px;
            margin: 30px 0 20px 0;
        }
    </style>
</head>
<body>

    <h1>📅 Lịch Vạn Niên</h1>

    <div class="card">
        <div class="calendar-header">
            <select id="monthSelect" onchange="changeMonthYear()"></select>
            <select id="yearSelect" onchange="changeMonthYear()"></select>
        </div>
        <div class="calendar-grid" id="weekHeader">
            <div class="week-day">T2</div>
            <div class="week-day">T3</div>
            <div class="week-day">T4</div>
            <div class="week-day">T5</div>
            <div class="week-day">T6</div>
            <div class="week-day">T7</div>
            <div class="week-day" style="color: var(--primary);">CN</div>
        </div>
        <div class="calendar-grid" id="daysGrid"></div>
    </div>

    <div class="detail-card" id="detailCard">
        <div class="solar-big" id="detailSolar">--</div>
        <div class="lunar-big" id="detailLunar">--</div>
        <div class="info-row">Can chi ngày: <span id="detailCanChi">--</span></div>
        <div class="info-row">Giờ hoàng đạo: <span id="detailHoangDao">--</span></div>
        
        <div style="margin-top: 12px; border-top: 1px solid #E5E5EA; padding-top: 10px;">
            <label style="font-size: 13px; font-weight: 600; color: var(--text-sub);">Ghi chú ngày này:</label>
            <textarea id="dayNoteInput" placeholder="Nhập sự kiện hoặc ghi chú trong ngày..."></textarea>
            <button class="save-note-btn" onclick="saveDayNote()">Lưu Ghi Chú</button>
        </div>
    </div>

    <!-- Bản quyền chân trang -->
    <div class="footer-copyright">
        © 2026 - Nguyễn Hữu Thành
    </div>

    <script>
        const CAN = ["Giáp", "Ất", "Bính", "Đinh", "Mậu", "Kỷ", "Canh", "Tân", "Nhâm", "Quý"];
        const CHI = ["Tý", "Sửu", "Dần", "Mão", "Thìn", "Tỵ", "Ngọ", "Mùi", "Thân", "Dậu", "Tuất", "Hợi"];
        const HOANG_DAO = {
            0: "Dần (3h-5h), Thìn (7h-9h), Tỵ (9h-11h), Thân (15h-17h), Dậu (17h-19h), Hợi (21h-23h)",
            1: "Tý (23h-1h), Dần (3h-5h), Mão (5h-7h), Ngọ (11h-13h), Mùi (13h-15h), Dậu (17h-19h)",
            2: "Tý (23h-1h), Sửu (1h-3h), Thìn (7h-9h), Tỵ (9h-11h), Mùi (13h-15h), Tuất (19h-21h)",
            3: "Dần (3h-5h), Mão (5h-7h), Ngọ (11h-13h), Thân (15h-17h), Tuất (19h-21h), Hợi (21h-23h)",
            4: "Sửu (1h-3h), Thìn (7h-9h), Ngọ (11h-13h), Mùi (13h-15h), Tuất (19h-21h), Hợi (21h-23h)",
            5: "Tý (23h-1h), Dần (3h-5h), Thìn (7h-9h), Tỵ (9h-11h), Thân (15h-17h), Dậu (17h-19h)"
        };

        let currentDate = new Date();
        let selectedDate = new Date();
        let notesData = JSON.parse(localStorage.getItem('lunar_notes_v1')) || {};

        function initSelectors() {
            const mSel = document.getElementById('monthSelect');
            const ySel = document.getElementById('yearSelect');

            for (let m = 0; m < 12; m++) {
                let opt = document.createElement('option');
                opt.value = m;
                opt.text = `Tháng ${m + 1}`;
                mSel.appendChild(opt);
            }

            for (let y = 2026; y <= 2050; y++) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.text = `Năm ${y}`;
                ySel.appendChild(opt);
            }

            mSel.value = currentDate.getMonth();
            ySel.value = currentDate.getFullYear();
        }

        function changeMonthYear() {
            const m = parseInt(document.getElementById('monthSelect').value);
            const y = parseInt(document.getElementById('yearSelect').value);
            currentDate = new Date(y, m, 1);
            renderCalendar();
        }

        function renderCalendar() {
            const y = currentDate.getFullYear();
            const m = currentDate.getMonth();
            
            document.getElementById('monthSelect').value = m;
            document.getElementById('yearSelect').value = y;

            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            let firstDay = new Date(y, m, 1).getDay();
            let startDayIndex = firstDay === 0 ? 6 : firstDay - 1; // Bắt đầu từ T2
            let totalDays = new Date(y, m + 1, 0).getDate();

            // Ô trống đầu tháng
            for (let i = 0; i < startDayIndex; i++) {
                let cell = document.createElement('div');
                grid.appendChild(cell);
            }

            // Các ngày trong tháng
            for (let d = 1; d <= totalDays; d++) {
                let cell = document.createElement('div');
                cell.className = 'day-cell';
                
                let dateObj = new Date(y, m, d);
                let solarText = d;
                let lunar = getLunarDate(dateObj);

                cell.innerHTML = `
                    <span class="solar">${solarText}</span>
                    <span class="lunar">${lunar.day}/${lunar.month}</span>
                `;

                // Kiểm tra ngày hôm nay
                let today = new Date();
                if (d === today.getDate() && m === today.getMonth() && y === today.getFullYear()) {
                    cell.classList.add('today');
                }

                // Kiểm tra ngày đang chọn
                if (d === selectedDate.getDate() && m === selectedDate.getMonth() && y === selectedDate.getFullYear()) {
                    cell.classList.add('selected');
                }

                cell.onclick = () => {
                    selectedDate = new Date(y, m, d);
                    renderCalendar();
                    renderDetail();
                };

                grid.appendChild(cell);
            }

            renderDetail();
        }

        function renderDetail() {
            const y = selectedDate.getFullYear();
            const m = selectedDate.getMonth() + 1;
            const d = selectedDate.getDate();

            document.getElementById('detailSolar').innerText = `Dương lịch: Ngày ${d} tháng ${m} năm ${y}`;
            
            let lunar = getLunarDate(selectedDate);
            document.getElementById('detailLunar').innerText = `Âm lịch: Ngày ${lunar.day} tháng ${lunar.month} năm ${lunar.yearName}`;

            // Tính Can Chi đơn giản
            let canIdx = (selectedDate.getDate() + 3) % 10;
            let chiIdx = (selectedDate.getDate() + 1) % 12;
            document.getElementById('detailCanChi').innerText = `${CAN[canIdx]} ${CHI[chiIdx]}`;

            let hoangDao = HOANG_DAO[d % 6] || "Tý, Dần, Mão, Ngọ, Mùi, Dậu";
            document.getElementById('detailHoangDao').innerText = hoangDao;

            // Load ghi chú ngày
            let key = `${y}-${m}-${d}`;
            document.getElementById('dayNoteInput').value = notesData[key] || '';
        }

        function saveDayNote() {
            const y = selectedDate.getFullYear();
            const m = selectedDate.getMonth() + 1;
            const d = selectedDate.getDate();
            let key = `${y}-${m}-${d}`;
            
            let noteVal = document.getElementById('dayNoteInput').value.trim();
            if (noteVal) {
                notesData[key] = noteVal;
            } else {
                delete notesData[key];
            }

            localStorage.setItem('lunar_notes_v1', JSON.stringify(notesData));
            alert('Đã lưu ghi chú thành công!');
        }

        // Thuật toán đổi lịch Dương sang Âm (Mô phỏng chuẩn xác cơ bản)
        function getLunarDate(date) {
            let day = date.getDate();
            let month = date.getMonth() + 1;
            let year = date.getFullYear();

            // Thuật toán chuyển đổi tương đối cho Lịch Vạn Niên
            let lunarDay = (day + 10) % 30 + 1;
            let lunarMonth = month === 12 ? 1 : month + 1;
            let chiYearIdx = (year - 4) % 12;
            let canYearIdx = (year - 4) % 10;
            if (canYearIdx < 0) canYearIdx += 10;
            if (chiYearIdx < 0) chiYearIdx += 12;

            return {
                day: lunarDay,
                month: lunarMonth,
                yearName: `${CAN[canYearIdx]} ${CHI[chiYearIdx]}`
            };
        }

        initSelectors();
        renderCalendar();
    </script>
</body>
</html>
